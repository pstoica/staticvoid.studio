<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<title>Loom · draw — shape packs</title>
<style>
  :root { --bg:#0a0a0c; --panel:#111118; --ink:#e9e9ea; --dim:#8b8b95; --edge:#26262e; --acc:#56b6ff;
    --tap:42px; --safe-b: env(safe-area-inset-bottom, 0px); }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--ink); font:13px/1.35 "SF Mono", ui-monospace, Menlo, monospace;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    -webkit-user-select:none; user-select:none; touch-action:manipulation; }

  /* ── header ───────────────────────────────────────────────────────────────── */
  header { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:7px 10px;
    padding-top:calc(7px + env(safe-area-inset-top, 0px)); border-bottom:1px solid var(--edge); }
  header h1 { font-size:14px; white-space:nowrap; }
  header h1 a { color:var(--ink); text-decoration:none; }
  header h1 span { color:var(--acc); }
  header .spacer { flex:1 1 auto; }
  #packSel { max-width:34vw; }

  /* ── stage: canvas owns the leftover space, never reflows ─────────────────── */
  .stage { flex:1 1 auto; min-height:0; position:relative; display:grid; place-items:center;
    padding:8px; container-type:size; }
  /* the board IS the render: it draws through the pack's connector algorithm, so what
     you paint on is what Loom will show (a faint grid keeps cells targetable) */
  #board { width:min(100cqw, 100cqh); height:min(100cqw, 100cqh); aspect-ratio:1;
    touch-action:none; cursor:crosshair;
    border:1px solid var(--edge); border-radius:10px;
    background: repeating-conic-gradient(#15151c 0% 25%, #101016 0% 50%) 0 0 / 12.5% 12.5%; }
  #board.pixels { image-rendering:pixelated; }

  /* ── controls: ALL inline, always visible, fixed height (no drawer) ───────── */
  .panel { flex:0 0 auto; border-top:1px solid var(--edge); background:var(--panel);
    padding:7px 0 calc(7px + var(--safe-b)); display:flex; flex-direction:column; gap:7px; }
  .row { display:flex; gap:7px; align-items:center; padding:0 10px; overflow-x:auto;
    overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .row::-webkit-scrollbar { display:none; }
  .row > .lbl { flex:0 0 auto; color:var(--dim); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; width:3.6em; }
  .seg { flex:0 0 auto; display:inline-flex; border:1px solid var(--edge); border-radius:9px; overflow:hidden; }
  .seg button { min-height:36px; padding:0 11px; border:0; border-right:1px solid var(--edge);
    background:transparent; color:var(--dim); font:inherit; border-radius:0; cursor:pointer; }
  .seg button:last-child { border-right:0; }
  .seg button.on { background:var(--acc); color:#06070a; font-weight:600; }

  .sw { flex:0 0 auto; width:var(--tap); height:var(--tap); border-radius:10px;
    border:2px solid transparent; padding:0; cursor:pointer; }
  .sw.on { border-color:#fff; }
  .sw.eraser { background: repeating-conic-gradient(#333 0% 25%, #191919 0% 50%) 0 0 / 50% 50%; }
  input[type="color"] { flex:0 0 auto; width:var(--tap); height:var(--tap); border:none; padding:0;
    background:none; cursor:pointer; }

  /* opacity: 10 discrete steps you can hit with a thumb */
  .ops { flex:0 0 auto; display:inline-flex; gap:3px; }
  .ops button { width:26px; height:34px; padding:0; border:1px solid var(--edge); border-radius:6px;
    background:#0c0c12; cursor:pointer; position:relative; overflow:hidden; }
  .ops button i { position:absolute; inset:0; background:var(--ink); display:block; }
  .ops button.on { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset; }

  #frames canvas { flex:0 0 auto; width:44px; height:44px; image-rendering:pixelated;
    border:2px solid var(--edge); border-radius:8px; cursor:pointer;
    background: repeating-conic-gradient(#15151c 0% 25%, #101016 0% 50%) 0 0 / 25% 25%; }
  #frames canvas.on { border-color:var(--acc); }

  button, select, input[type="text"] { font:inherit; color:var(--ink); background:var(--panel);
    border:1px solid var(--edge); border-radius:8px; }
  .btn { flex:0 0 auto; min-height:36px; padding:0 11px; cursor:pointer; touch-action:manipulation; }
  .btn:active, .btn.on { border-color:var(--acc); }
  .btn.on { background:var(--acc); color:#06070a; font-weight:600; }
  select { min-height:34px; padding:0 8px; }
  input[type="text"] { min-height:36px; padding:0 10px; }

  /* room setup — rare, so it's a compact inline strip you toggle, not a drawer of brushes */
  .room { display:none; }
  .room.open { display:flex; flex-wrap:wrap; }
  #qr { width:120px; height:120px; image-rendering:pixelated; border-radius:8px;
    background:#fff; padding:6px; flex:0 0 auto; }
  .dot { width:8px; height:8px; border-radius:50%; background:#444; flex:0 0 auto; }
  .dot.on { background:#6df0c2; }
  .hint { color:var(--dim); font-size:11px; }
  .hint code { color:var(--ink); background:#0c0c12; padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>

<header>
  <h1><a href="../">Loom</a><span>·draw</span></h1>
  <select id="packSel" aria-label="pack"></select>
  <button class="btn" id="newPack" title="new pack">+pack</button>
  <span class="spacer"></span>
  <span class="dot" id="roomDot"></span>
  <button class="btn" id="roomToggle">room</button>
</header>

<main class="stage">
  <canvas id="board" width="256" height="256"></canvas>
</main>

<div class="panel">
  <!-- brush: every control you touch mid-drawing is right here -->
  <div class="row">
    <span class="lbl">stroke</span>
    <div class="seg" id="strokeSeg">
      <button data-v="line" class="on">join</button><button data-v="curve">smooth</button><button data-v="dots">stamp</button>
    </div>
    <span class="lbl">mirror</span>
    <div class="seg" id="mirrorSeg">
      <button data-v="off" class="on">off</button><button data-v="x">x</button><button data-v="xy">xy</button><button data-v="radial">✳</button>
    </div>
  </div>

  <div class="row">
    <span class="lbl">connect</span>
    <div class="seg" id="connectSeg">
      <button data-v="pixels" class="on">pixels</button><button data-v="smooth">smooth</button><button data-v="rounded">rounded</button><button data-v="metaball">blob</button>
    </div>
    <span class="lbl">grid</span>
    <div class="seg" id="gridSeg">
      <button data-v="8">8</button><button data-v="16">16</button><button data-v="32" class="on">32</button><button data-v="64">64</button>
    </div>
  </div>

  <div class="row">
    <span class="lbl">alpha</span>
    <div class="ops" id="ops"></div>
  </div>

  <div class="row" id="pal"></div>
  <div class="row" id="frames"></div>

  <div class="row">
    <button class="btn" id="dupFrame">dup</button>
    <button class="btn" id="delFrame">del frame</button>
    <button class="btn" id="clearFrame">clear</button>
    <button class="btn" id="delPack">del pack</button>
    <span class="hint">in Loom: <code id="nameHint">shape("pack")</code></span>
  </div>

  <div class="row room" id="roomRow">
    <input type="text" id="roomCode" placeholder="room code" spellcheck="false" autocapitalize="off" style="width:8.5em" />
    <button class="btn" id="roomBtn">join</button>
    <input type="text" id="roomHost" placeholder="wss://loom-room.…workers.dev" spellcheck="false" autocapitalize="off" style="flex:1 1 12em; min-width:9em" />
    <span class="hint" id="roomStat">off</span>
    <canvas id="qr" width="120" height="120"></canvas>
  </div>
</div>

<script type="module">
import { renderPackFrame } from '../packrender.js';
import qrcode from 'qrcode-generator';

const KEY = 'loom.shapepacks';
// FIDELITY is per frame and inferred from the frame image itself, so one pack can mix a
// chunky 16² key-frame with a detailed 64² one — packrender/Loom read the size the same way.
let S = 32;
const SC = 8;                                  // board pixels per cell (render scale)
const PALETTE = ['#f4f6fb', '#0a0a0a', '#ff5d73', '#ff9d5c', '#ffd166', '#6df0c2', '#56e0ff',
  '#56b6ff', '#b58cff', '#ff8ad1', '#b5179e', '#3a0ca3', '#1b4332', '#6a040f'];

const $ = (s) => document.querySelector(s);
const board = $('#board'), bctx = board.getContext('2d');

// ── storage ────────────────────────────────────────────────────────────────────
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { v: 1, packs: {} }; } catch { return { v: 1, packs: {} }; } };
let db = load();
if (!db.packs) db = { v: 1, packs: {} };
let packName = Object.keys(db.packs)[0] || 'doodles';
if (!db.packs[packName]) db.packs[packName] = { frames: [blankFrame()] };
let frameIdx = 0;
function blankFrame(size) { const c = document.createElement('canvas'); c.width = c.height = size || S; return c.toDataURL(); }
let applyingRemote = false;
function save() {
  localStorage.setItem(KEY, JSON.stringify(db));
  if (!applyingRemote) roomPublish(packName);
}

// ── the working frame lives in an offscreen canvas ─────────────────────────────
const work = document.createElement('canvas'); work.width = work.height = S;
const wctx = work.getContext('2d', { willReadFrequently: true });
function loadFrame(i) {
  frameIdx = Math.max(0, Math.min(i, db.packs[packName].frames.length - 1));
  const img = new Image();
  img.onload = () => {
    S = img.width || 32;                       // the frame's own fidelity
    work.width = work.height = S;
    wctx.clearRect(0, 0, S, S); wctx.drawImage(img, 0, 0);
    syncSeg(connectSeg, packMode()); syncSeg(gridSeg, String(S));
    paint(); renderFrames();
  };
  img.src = db.packs[packName].frames[frameIdx];
}
function commit() { db.packs[packName].frames[frameIdx] = work.toDataURL(); save(); renderFrames(); }

// ── the BOARD is the render ────────────────────────────────────────────────────
// It draws through the pack's connector algorithm (the same packrender.js Loom uses), so
// you paint directly on what the shape will look like. A metaball pass is ~65k pixels, so
// while a stroke is live we compute at half scale and upscale; full pass on release.
const packMode = () => db.packs[packName].mode || 'pixels';
let paintPending = false;
function paint() {
  const mode = packMode(), W = S * SC;
  if (board.width !== W) { board.width = board.height = W; }
  const out = renderPackFrame(work, mode, SC);
  bctx.clearRect(0, 0, W, W);
  bctx.imageSmoothingEnabled = mode !== 'pixels';
  bctx.drawImage(out, 0, 0, W, W);
  board.classList.toggle('pixels', mode === 'pixels');
  // faint cell grid so you can still aim at individual pixels through the blobs
  bctx.save();
  bctx.strokeStyle = 'rgba(255,255,255,0.055)'; bctx.lineWidth = 1;
  bctx.beginPath();
  for (let i = 1; i < S; i++) { const p = Math.round(i * SC) + 0.5;
    bctx.moveTo(p, 0); bctx.lineTo(p, W); bctx.moveTo(0, p); bctx.lineTo(W, p); }
  bctx.stroke(); bctx.restore();
}
function paintSoon() {                         // coalesce to one render per animation frame
  if (paintPending) return;
  paintPending = true;
  requestAnimationFrame(() => { paintPending = false; paint(); });
}
// resample the current frame to a new fidelity (nearest — keeps the pixel look)
const gridSeg = $('#gridSeg');
function setFidelity(n) {
  if (n === S) return;
  const tmp = document.createElement('canvas'); tmp.width = tmp.height = n;
  const tx = tmp.getContext('2d'); tx.imageSmoothingEnabled = false;
  tx.drawImage(work, 0, 0, n, n);
  S = n; work.width = work.height = n;
  wctx.clearRect(0, 0, n, n); wctx.drawImage(tmp, 0, 0);
  paint(); commit();
}

// ── segmented controls (inline, tappable, state visible at a glance) ──────────
const strokeSeg = $('#strokeSeg'), mirrorSeg = $('#mirrorSeg'), connectSeg = $('#connectSeg');
function syncSeg(seg, v) { for (const b of seg.children) b.classList.toggle('on', b.dataset.v === v); }
function onSeg(seg, fn) {
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    syncSeg(seg, b.dataset.v); fn(b.dataset.v);
  });
}
let stroke = 'line', mirror = 'off';
onSeg(strokeSeg, (v) => { stroke = v; });
onSeg(mirrorSeg, (v) => { mirror = v; });
onSeg(gridSeg, (v) => setFidelity(+v));
onSeg(connectSeg, (v) => { db.packs[packName].mode = v; save(); paint(); });

// ── opacity: 10 discrete steps ─────────────────────────────────────────────────
let alpha = 1;
const opsEl = $('#ops');
function renderOps() {
  opsEl.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const a = i / 10;
    const b = document.createElement('button');
    b.title = Math.round(a * 100) + '%';
    b.className = Math.abs(a - alpha) < 0.001 ? 'on' : '';
    const bar = document.createElement('i'); bar.style.opacity = String(a);
    b.appendChild(bar);
    b.addEventListener('click', () => { alpha = a; renderOps(); });
    opsEl.appendChild(b);
  }
}

// ── painting ───────────────────────────────────────────────────────────────────
let color = PALETTE[0], eraser = false, down = false, last = null, pts = [];
function px(e) {
  const r = board.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) / r.width * S), Math.floor((e.clientY - r.top) / r.height * S)];
}
// a cell is REPLACED, never accumulated: clear then paint at the chosen alpha, so
// painting 40% twice still reads 40% (predictable, unlike additive brushing)
function plotRaw(x, y) {
  if (x < 0 || y < 0 || x >= S || y >= S) return;
  wctx.clearRect(x, y, 1, 1);
  if (eraser) return;
  wctx.globalAlpha = alpha;
  wctx.fillStyle = color;
  wctx.fillRect(x, y, 1, 1);
  wctx.globalAlpha = 1;
}
function plot(x, y) {
  const M = S - 1;
  plotRaw(x, y);
  if (mirror === 'x') plotRaw(M - x, y);
  else if (mirror === 'xy') { plotRaw(M - x, y); plotRaw(x, M - y); plotRaw(M - x, M - y); }
  else if (mirror === 'radial') { plotRaw(M - y, x); plotRaw(M - x, M - y); plotRaw(y, M - x); }
}
function line(a, b) {
  let [x0, y0] = a, [x1, y1] = b;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    plot(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function curveSeg(p0, p1, p2, p3) {
  const steps = Math.max(2, (Math.abs(p2[0] - p1[0]) + Math.abs(p2[1] - p1[1])) * 2 + 2);
  let prev = p1;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps, t2 = t * t, t3 = t2 * t;
    const q = [0, 1].map((k) => Math.round(0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t
      + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2
      + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
    line(prev, q); prev = q;
  }
}
board.addEventListener('pointerdown', (e) => { e.preventDefault(); down = true; board.setPointerCapture(e.pointerId);
  last = px(e); pts = [last]; plot(...last); paintSoon(); });
board.addEventListener('pointermove', (e) => { if (!down) return;
  e.preventDefault();
  const p = px(e);
  if (p[0] === last[0] && p[1] === last[1]) return;
  if (stroke === 'dots') plot(...p);
  else if (stroke === 'line') line(last, p);
  else {
    // smooth: only take an anchor every few cells, then curve THROUGH them — sampling
    // every pixel would just reproduce the raw path (which is why this looked identical
    // to `join` before). Decimating is what actually rounds a wobbly hand stroke.
    const a = pts[pts.length - 1];
    if (Math.abs(p[0] - a[0]) + Math.abs(p[1] - a[1]) < 3) return;
    pts.push(p); const n = pts.length;
    if (n >= 3) curveSeg(pts[n - 4] || pts[n - 3], pts[n - 3], pts[n - 2], pts[n - 1]);
  }
  last = p; paintSoon(); });
const up = () => { if (!down) return; down = false;
  if (stroke === 'curve' && pts.length >= 2) {
    // finish at the pointer, not at the last decimated anchor
    const tail = pts[pts.length - 1];
    if (last && (last[0] !== tail[0] || last[1] !== tail[1])) pts.push(last);
    const n = pts.length;
    curveSeg(pts[n - 3] || pts[n - 2], pts[n - 2], pts[n - 1], pts[n - 1]);
  }
  paint();
  commit(); };
board.addEventListener('pointerup', up);
board.addEventListener('pointercancel', up);

// ── palette ────────────────────────────────────────────────────────────────────
const pal = $('#pal');
function renderPal() {
  pal.innerHTML = '';
  for (const c of PALETTE) {
    const b = document.createElement('button');
    b.className = 'sw' + (!eraser && c === color ? ' on' : '');
    b.style.background = c;
    b.addEventListener('click', () => { color = c; eraser = false; renderPal(); });
    pal.appendChild(b);
  }
  const custom = document.createElement('input');
  custom.type = 'color'; custom.value = /^#([0-9a-f]{6})$/i.test(color) ? color : '#ffffff';
  custom.addEventListener('input', () => { color = custom.value; eraser = false; renderPal(); });
  pal.appendChild(custom);
  const er = document.createElement('button');
  er.className = 'sw eraser' + (eraser ? ' on' : ''); er.title = 'eraser';
  er.addEventListener('click', () => { eraser = !eraser; renderPal(); });
  pal.appendChild(er);
}

// ── frames ─────────────────────────────────────────────────────────────────────
const framesEl = $('#frames');
function renderFrames() {
  framesEl.innerHTML = '';
  db.packs[packName].frames.forEach((url, i) => {
    const c = document.createElement('canvas');
    c.className = i === frameIdx ? 'on' : '';
    const x = c.getContext('2d');
    // each frame carries its own fidelity, so size the thumb from the image itself
    const img = new Image();
    img.onload = () => { c.width = c.height = img.width; c.title = 'frame ' + i + ' · ' + img.width + '²';
      x.imageSmoothingEnabled = false; x.drawImage(img, 0, 0); };
    img.src = url;
    c.addEventListener('click', () => loadFrame(i));
    framesEl.appendChild(c);
  });
  const add = document.createElement('button');
  add.className = 'btn'; add.textContent = '+ frame';
  add.addEventListener('click', addFrame);
  framesEl.appendChild(add);
}
function addFrame() { db.packs[packName].frames.push(blankFrame()); save(); loadFrame(db.packs[packName].frames.length - 1); }
$('#dupFrame').addEventListener('click', () => { const f = db.packs[packName].frames; f.splice(frameIdx + 1, 0, f[frameIdx]); save(); loadFrame(frameIdx + 1); });
$('#delFrame').addEventListener('click', () => { const f = db.packs[packName].frames;
  if (f.length <= 1) return; f.splice(frameIdx, 1); save(); loadFrame(Math.min(frameIdx, f.length - 1)); });
$('#clearFrame').addEventListener('click', () => { wctx.clearRect(0, 0, S, S); paint(); commit(); });

// ── packs ──────────────────────────────────────────────────────────────────────
const packSel = $('#packSel'), nameHint = $('#nameHint');
function renderPacks() {
  packSel.innerHTML = '';
  for (const name of Object.keys(db.packs)) {
    const o = document.createElement('option');
    o.value = o.textContent = name; o.selected = name === packName;
    packSel.appendChild(o);
  }
  nameHint.textContent = 'shape("' + packName + '")';
}
packSel.addEventListener('change', () => { packName = packSel.value; loadFrame(0); renderPacks(); });
$('#newPack').addEventListener('click', () => {
  const raw = prompt('New pack name:', '');
  const name = (raw || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
  if (!name || db.packs[name]) return;
  db.packs[name] = { frames: [blankFrame()] };
  packName = name; save(); renderPacks(); loadFrame(0);
});
$('#delPack').addEventListener('click', () => {
  if (Object.keys(db.packs).length <= 1) return;
  if (!confirm('Delete pack "' + packName + '"?')) return;
  const gone = packName;
  delete db.packs[gone]; packName = Object.keys(db.packs)[0];
  localStorage.setItem(KEY, JSON.stringify(db));
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'drop', name: gone }));
  renderPacks(); loadFrame(0);
});

// ── rooms (setup, so it's a toggled strip — the brush controls stay put) ───────
const HOST_KEY = 'loom.roomHost', CODE_KEY = 'loom.roomCode';
const roomRow = $('#roomRow'), roomBtn = $('#roomBtn'), roomCodeIn = $('#roomCode'),
  roomHostIn = $('#roomHost'), roomStat = $('#roomStat'), roomDot = $('#roomDot'), qrCanvas = $('#qr');
const params = new URLSearchParams(location.search);
roomHostIn.value = params.get('host') || localStorage.getItem(HOST_KEY) || '';
roomCodeIn.value = params.get('room') || localStorage.getItem(CODE_KEY) || '';
let ws = null;
const setStat = (s, live) => { roomStat.textContent = s; roomDot.classList.toggle('on', !!live); };
$('#roomToggle').addEventListener('click', () => {
  const open = roomRow.classList.toggle('open');
  $('#roomToggle').classList.toggle('on', open);
  if (open) renderQR();
});
function roomPublish(name) {
  if (!ws || ws.readyState !== 1) return;
  const pack = db.packs[name];
  if (pack) ws.send(JSON.stringify({ t: 'pack', name, pack }));
}
function applyRemotePack(name, pack) {
  applyingRemote = true;
  db.packs[name] = pack;
  localStorage.setItem(KEY, JSON.stringify(db));
  applyingRemote = false;
  renderPacks();
  if (name === packName) loadFrame(frameIdx); else renderFrames();
}
function roomJoin() {
  const host = (roomHostIn.value || '').trim().replace(/\/+$/, '');
  const code = (roomCodeIn.value || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
  if (!host || !code) { setStat('needs a server + code'); return; }
  localStorage.setItem(HOST_KEY, host); localStorage.setItem(CODE_KEY, code);
  setStat('connecting…');
  try { ws = new WebSocket(host.replace(/^http/, 'ws') + '/r/' + code); }
  catch { setStat('bad server url'); ws = null; return; }
  ws.onopen = () => {
    setStat('in "' + code + '"', true);
    roomBtn.textContent = 'leave'; roomBtn.classList.add('on');
    for (const name of Object.keys(db.packs)) roomPublish(name);
    renderQR();
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === 'state') { for (const [name, pack] of Object.entries(m.packs || {})) applyRemotePack(name, pack); }
    else if (m.t === 'pack') applyRemotePack(m.name, m.pack);
    else if (m.t === 'drop') { applyingRemote = true; delete db.packs[m.name];
      if (!Object.keys(db.packs).length) db.packs[packName] = { frames: [blankFrame()] };
      localStorage.setItem(KEY, JSON.stringify(db)); applyingRemote = false;
      if (m.name === packName) { packName = Object.keys(db.packs)[0]; loadFrame(0); }
      renderPacks(); }
    else if (m.t === 'peers') setStat('in "' + code + '" · ' + m.n + ' here', true);
  };
  ws.onclose = () => { ws = null; setStat('disconnected'); roomBtn.textContent = 'join'; roomBtn.classList.remove('on'); };
  ws.onerror = () => setStat('connection failed');
}
roomBtn.addEventListener('click', () => {
  if (ws) { try { ws.close(); } catch {} ws = null; setStat('off');
    roomBtn.textContent = 'join'; roomBtn.classList.remove('on'); return; }
  roomJoin();
});
// QR of the join link — scan from a phone to land in the same room, server and all
function renderQR() {
  const host = (roomHostIn.value || '').trim(), code = (roomCodeIn.value || '').trim();
  const x = qrCanvas.getContext('2d');
  x.clearRect(0, 0, qrCanvas.width, qrCanvas.height);
  if (!host || !code) { qrCanvas.style.opacity = '0.25'; return; }
  qrCanvas.style.opacity = '1';
  const link = location.origin + location.pathname + '?room=' + encodeURIComponent(code)
    + '&host=' + encodeURIComponent(host);
  const qr = qrcode(0, 'L'); qr.addData(link); qr.make();
  const n = qr.getModuleCount(), cell = Math.floor(qrCanvas.width / n), off = (qrCanvas.width - cell * n) / 2;
  x.fillStyle = '#fff'; x.fillRect(0, 0, qrCanvas.width, qrCanvas.height);
  x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) x.fillRect(off + c * cell, off + r * cell, cell, cell);
}
roomCodeIn.addEventListener('input', renderQR);
roomHostIn.addEventListener('input', renderQR);

save();
renderPal(); renderOps(); renderPacks(); renderFrames(); loadFrame(0);
setStat('off');
if (params.get('room') && roomHostIn.value) { roomRow.classList.add('open'); $('#roomToggle').classList.add('on'); roomJoin(); }
</script>
