<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Loom · draw — shape packs</title>
<style>
  :root { --bg:#0a0a0c; --panel:#111118; --ink:#e9e9ea; --dim:#8b8b95; --edge:#26262e; --acc:#56b6ff; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font:14px/1.45 "SF Mono", ui-monospace, Menlo, monospace;
    display:flex; flex-direction:column; align-items:center; gap:14px; padding:18px; }
  header { width:min(560px, 100%); display:flex; align-items:baseline; gap:10px; }
  header h1 { font-size:18px; letter-spacing:0.02em; }
  header h1 a { color:var(--ink); text-decoration:none; }
  header h1 span { color:var(--acc); }
  header p { color:var(--dim); font-size:12px; }
  .row { width:min(560px, 100%); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type="text"] { background:var(--panel); color:var(--ink); border:1px solid var(--edge);
    border-radius:6px; padding:6px 10px; font:inherit; width:11em; }
  button { background:var(--panel); color:var(--ink); border:1px solid var(--edge); border-radius:6px;
    padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); color:#06070a; border-color:var(--acc); font-weight:600; }
  select { background:var(--panel); color:var(--ink); border:1px solid var(--edge); border-radius:6px; padding:6px 8px; font:inherit; }
  .stage { width:min(560px, 92vw); display:flex; gap:12px; align-items:flex-start; }
  #board { flex:1 1 auto; aspect-ratio:1; image-rendering:pixelated; touch-action:none;
    border:1px solid var(--edge); border-radius:8px; cursor:crosshair;
    background: repeating-conic-gradient(#15151c 0% 25%, #101016 0% 50%) 0 0 / 12.5% 12.5%; }
  #preview { width:132px; height:132px; flex:0 0 auto; border:1px solid var(--edge); border-radius:8px;
    background: repeating-conic-gradient(#15151c 0% 25%, #101016 0% 50%) 0 0 / 25% 25%; }
  .pvlabel { color:var(--dim); font-size:11px; text-align:center; margin-top:4px; }
  @media (max-width:640px) { #preview { width:92px; height:92px; } }
  #pal { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .sw { width:26px; height:26px; border-radius:6px; border:2px solid transparent; cursor:pointer; padding:0; }
  .sw.on { border-color:#fff; }
  .sw.eraser { background: repeating-conic-gradient(#333 0% 25%, #191919 0% 50%) 0 0 / 50% 50%; }
  input[type="color"] { width:26px; height:26px; border:none; padding:0; background:none; cursor:pointer; }
  #frames { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #frames canvas { width:56px; height:56px; image-rendering:pixelated; border:2px solid var(--edge);
    border-radius:6px; cursor:pointer; background: repeating-conic-gradient(#15151c 0% 25%, #101016 0% 50%) 0 0 / 25% 25%; }
  #frames canvas.on { border-color:var(--acc); }
  footer { width:min(560px, 100%); color:var(--dim); font-size:12px; }
  footer code { color:var(--ink); background:var(--panel); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1><a href="../">Loom</a> <span>· draw</span></h1>
  <p>pixel shape packs — paint here, pattern there</p>
</header>

<div class="row">
  <select id="packSel"></select>
  <input type="text" id="packName" placeholder="new pack name" spellcheck="false" />
  <button id="newPack">new pack</button>
  <button id="delPack" title="delete this pack">delete</button>
</div>

<div class="row">
  <button id="roomBtn">join room</button>
  <input type="text" id="roomCode" placeholder="room code" spellcheck="false" style="width:8em" />
  <input type="text" id="roomHost" placeholder="wss://loom-room.…workers.dev" spellcheck="false" style="width:15em" />
  <span id="roomStat" style="color:var(--dim); font-size:12px">off</span>
</div>

<div class="stage">
  <canvas id="board" width="32" height="32"></canvas>
  <div>
    <canvas id="preview" width="256" height="256"></canvas>
    <div class="pvlabel">as Loom draws it</div>
  </div>
</div>

<div class="row">
  <label style="color:var(--dim)">stroke</label>
  <select id="strokeSel">
    <option value="line">line — straight connect (Bresenham)</option>
    <option value="curve">curve — smooth connect (Catmull-Rom)</option>
    <option value="dots">dots — no connect</option>
  </select>
  <label style="color:var(--dim)">mirror</label>
  <select id="mirrorSel">
    <option value="off">off</option>
    <option value="x">x — left/right</option>
    <option value="xy">xy — quadrants</option>
    <option value="radial">radial — 4-fold turns</option>
  </select>
</div>

<div class="row">
  <label style="color:var(--dim)">connect</label>
  <select id="connectSel">
    <option value="pixels">pixels — raw grid</option>
    <option value="rounded">rounded — discs + bridges</option>
    <option value="metaball">metaball — cells fuse into blobs</option>
  </select>
  <span style="color:var(--dim); font-size:12px">how the cells render in Loom (per pack)</span>
</div>

<div class="row" id="pal"></div>

<div class="row">
  <button id="addFrame">+ frame</button>
  <button id="dupFrame">duplicate</button>
  <button id="delFrame">delete frame</button>
  <button id="clearFrame">clear</button>
</div>
<div class="row" id="frames"></div>

<footer>
  saves as you draw. in Loom (same browser): <code>shape("packname")</code> — pick frames with
  <code>.n("0 1 2")</code>, recolour with <code>.color(...).stencil(1)</code>. edits here update
  Loom live in another tab.
</footer>

<script type="module">
import { renderPackFrame } from '../packrender.js';
const KEY = 'loom.shapepacks';
const S = 32;                                      // grid size (Animal-Crossing-ish)
const PALETTE = ['#f4f6fb', '#0a0a0a', '#ff5d73', '#ff9d5c', '#ffd166', '#6df0c2', '#56e0ff',
  '#56b6ff', '#b58cff', '#ff8ad1', '#b5179e', '#3a0ca3', '#1b4332', '#6a040f'];

const $ = (s) => document.querySelector(s);
const board = $('#board'), bctx = board.getContext('2d');
bctx.imageSmoothingEnabled = false;

// ── storage ────────────────────────────────────────────────────────────────────
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { v: 1, packs: {} }; } catch { return { v: 1, packs: {} }; } };
let db = load();
if (!db.packs) db = { v: 1, packs: {} };
let packName = Object.keys(db.packs)[0] || 'doodles';
if (!db.packs[packName]) db.packs[packName] = { frames: [blankFrame()] };
let frameIdx = 0;
function blankFrame() { const c = document.createElement('canvas'); c.width = c.height = S; return c.toDataURL(); }
let applyingRemote = false;      // guard: don't echo a pack we just received back out
function save() {
  localStorage.setItem(KEY, JSON.stringify(db));
  if (!applyingRemote) roomPublish(packName);
}

// ── the working frame lives in an offscreen canvas ─────────────────────────────
const work = document.createElement('canvas'); work.width = work.height = S;
const wctx = work.getContext('2d', { willReadFrequently: true });
function loadFrame(i) {
  frameIdx = Math.max(0, Math.min(i, db.packs[packName].frames.length - 1));
  const img = new Image();
  img.onload = () => { wctx.clearRect(0, 0, S, S); wctx.drawImage(img, 0, 0); paint(); renderFrames();
    connectSel.value = packMode(); renderPreview(); };
  img.src = db.packs[packName].frames[frameIdx];
}
function commit() { db.packs[packName].frames[frameIdx] = work.toDataURL(); save(); renderFrames(); renderPreview(); }

// ── preview: the working frame through the pack's CONNECTOR mode — the same
// rasterizer Loom uses, so this is literally what the shape will look like ──────
const pv = $('#preview'), pvctx = pv.getContext('2d');
const connectSel = $('#connectSel');
const packMode = () => db.packs[packName].mode || 'pixels';
function renderPreview() {
  const out = renderPackFrame(work, packMode());
  pvctx.clearRect(0, 0, pv.width, pv.height);
  pvctx.imageSmoothingEnabled = packMode() !== 'pixels';
  pvctx.drawImage(out, 0, 0, pv.width, pv.height);
}
connectSel.addEventListener('change', () => {
  db.packs[packName].mode = connectSel.value; save(); renderPreview();
});

// ── painting ───────────────────────────────────────────────────────────────────
let color = PALETTE[0], eraser = false, down = false, last = null;
let stroke = 'line', mirror = 'off', pts = [];
$('#strokeSel').addEventListener('change', (e) => { stroke = e.target.value; });
$('#mirrorSel').addEventListener('change', (e) => { mirror = e.target.value; });
function px(e) {
  const r = board.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) / r.width * S), Math.floor((e.clientY - r.top) / r.height * S)];
}
function plotRaw(x, y) {
  if (x < 0 || y < 0 || x >= S || y >= S) return;
  if (eraser) wctx.clearRect(x, y, 1, 1);
  else { wctx.fillStyle = color; wctx.fillRect(x, y, 1, 1); }
}
// every plotted pixel goes through the mirror: x reflects, xy quadruples, radial turns
function plot(x, y) {
  const M = S - 1;
  plotRaw(x, y);
  if (mirror === 'x') plotRaw(M - x, y);
  else if (mirror === 'xy') { plotRaw(M - x, y); plotRaw(x, M - y); plotRaw(M - x, M - y); }
  else if (mirror === 'radial') { plotRaw(M - y, x); plotRaw(M - x, M - y); plotRaw(y, M - x); }
}
// Bresenham between pointer samples, so fast strokes stay connected
function line(a, b) {
  let [x0, y0] = a, [x1, y1] = b;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    plot(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
// Catmull-Rom segment p1→p2 (p0/p3 shape it), rasterized as short Bresenham runs
function curveSeg(p0, p1, p2, p3) {
  const steps = Math.max(2, (Math.abs(p2[0] - p1[0]) + Math.abs(p2[1] - p1[1])) * 2 + 2);
  let prev = p1;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps, t2 = t * t, t3 = t2 * t;
    const q = [0, 1].map((k) => Math.round(0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t
      + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2
      + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
    line(prev, q); prev = q;
  }
}
function paint() { bctx.clearRect(0, 0, S, S); bctx.drawImage(work, 0, 0); }
board.addEventListener('pointerdown', (e) => { down = true; board.setPointerCapture(e.pointerId);
  last = px(e); pts = [last]; plot(...last); paint(); });
board.addEventListener('pointermove', (e) => { if (!down) return;
  const p = px(e);
  if (p[0] === last[0] && p[1] === last[1]) return;      // same cell — nothing new
  if (stroke === 'dots') plot(...p);
  else if (stroke === 'line') line(last, p);
  else {                                                  // curve: draw one segment behind
    pts.push(p); const n = pts.length;
    if (n >= 3) curveSeg(pts[n - 4] || pts[n - 3], pts[n - 3], pts[n - 2], pts[n - 1]);
  }
  last = p; paint(); });
const up = () => { if (!down) return; down = false;
  if (stroke === 'curve' && pts.length >= 2) {            // flush the trailing segment
    const n = pts.length;
    curveSeg(pts[n - 3] || pts[n - 2], pts[n - 2], pts[n - 1], pts[n - 1]);
    paint();
  }
  commit(); };
board.addEventListener('pointerup', up);
board.addEventListener('pointercancel', up);

// ── palette ────────────────────────────────────────────────────────────────────
const pal = $('#pal');
function renderPal() {
  pal.innerHTML = '';
  for (const c of PALETTE) {
    const b = document.createElement('button');
    b.className = 'sw' + (!eraser && c === color ? ' on' : '');
    b.style.background = c;
    b.addEventListener('click', () => { color = c; eraser = false; renderPal(); });
    pal.appendChild(b);
  }
  const custom = document.createElement('input');
  custom.type = 'color'; custom.value = /^#([0-9a-f]{6})$/i.test(color) ? color : '#ffffff';
  custom.addEventListener('input', () => { color = custom.value; eraser = false; renderPal(); });
  pal.appendChild(custom);
  const er = document.createElement('button');
  er.className = 'sw eraser' + (eraser ? ' on' : ''); er.title = 'eraser';
  er.addEventListener('click', () => { eraser = !eraser; renderPal(); });
  pal.appendChild(er);
}

// ── frames strip ───────────────────────────────────────────────────────────────
const framesEl = $('#frames');
function renderFrames() {
  framesEl.innerHTML = '';
  db.packs[packName].frames.forEach((url, i) => {
    const c = document.createElement('canvas');
    c.width = c.height = S;
    c.className = i === frameIdx ? 'on' : '';
    c.title = 'frame ' + i;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    const img = new Image(); img.onload = () => x.drawImage(img, 0, 0); img.src = url;
    c.addEventListener('click', () => loadFrame(i));
    framesEl.appendChild(c);
  });
}
$('#addFrame').addEventListener('click', () => { db.packs[packName].frames.push(blankFrame()); save(); loadFrame(db.packs[packName].frames.length - 1); });
$('#dupFrame').addEventListener('click', () => { const f = db.packs[packName].frames; f.splice(frameIdx + 1, 0, f[frameIdx]); save(); loadFrame(frameIdx + 1); });
$('#delFrame').addEventListener('click', () => { const f = db.packs[packName].frames;
  if (f.length <= 1) return; f.splice(frameIdx, 1); save(); loadFrame(Math.min(frameIdx, f.length - 1)); });
$('#clearFrame').addEventListener('click', () => { wctx.clearRect(0, 0, S, S); paint(); commit(); });

// ── packs ──────────────────────────────────────────────────────────────────────
const packSel = $('#packSel');
function renderPacks() {
  packSel.innerHTML = '';
  for (const name of Object.keys(db.packs)) {
    const o = document.createElement('option');
    o.value = o.textContent = name; o.selected = name === packName;
    packSel.appendChild(o);
  }
}
packSel.addEventListener('change', () => { packName = packSel.value; loadFrame(0); renderPacks(); });
$('#newPack').addEventListener('click', () => {
  const name = ($('#packName').value || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
  if (!name || db.packs[name]) return;
  db.packs[name] = { frames: [blankFrame()] };
  packName = name; $('#packName').value = ''; save(); renderPacks(); loadFrame(0);
});
$('#delPack').addEventListener('click', () => {
  if (Object.keys(db.packs).length <= 1) return;
  if (!confirm('Delete pack "' + packName + '"?')) return;
  delete db.packs[packName]; packName = Object.keys(db.packs)[0]; save(); renderPacks(); loadFrame(0);
});

// ── rooms ──────────────────────────────────────────────────────────────────────
// Everyone who joins the same room code shares packs live (see /loom-room). Remote
// packs are written into the SAME localStorage the solo editor uses, so a running
// Loom tab picks them up through its existing storage-event path — no Loom changes.
const HOST_KEY = 'loom.roomHost', CODE_KEY = 'loom.roomCode';
const roomBtn = $('#roomBtn'), roomCodeIn = $('#roomCode'), roomHostIn = $('#roomHost'), roomStat = $('#roomStat');
roomHostIn.value = localStorage.getItem(HOST_KEY) || '';
roomCodeIn.value = localStorage.getItem(CODE_KEY) || '';
let ws = null, peers = 0;
const setStat = (s) => { roomStat.textContent = s; };
function roomPublish(name) {
  if (!ws || ws.readyState !== 1) return;
  const pack = db.packs[name];
  if (pack) ws.send(JSON.stringify({ t: 'pack', name, pack }));
}
function applyRemotePack(name, pack) {
  applyingRemote = true;
  db.packs[name] = pack;
  localStorage.setItem(KEY, JSON.stringify(db));
  applyingRemote = false;
  renderPacks();
  if (name === packName) loadFrame(frameIdx); else renderFrames();
}
function roomJoin() {
  const host = (roomHostIn.value || '').trim().replace(/\/+$/, '');
  const code = (roomCodeIn.value || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
  if (!host || !code) { setStat('need a server + code'); return; }
  localStorage.setItem(HOST_KEY, host); localStorage.setItem(CODE_KEY, code);
  const url = host.replace(/^http/, 'ws') + '/r/' + code;
  setStat('connecting…');
  try { ws = new WebSocket(url); } catch { setStat('bad server url'); ws = null; return; }
  ws.onopen = () => {
    setStat('in room "' + code + '"');
    roomBtn.textContent = 'leave room'; roomBtn.classList.add('on');
    for (const name of Object.keys(db.packs)) roomPublish(name);   // share what we have
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === 'state') { for (const [name, pack] of Object.entries(m.packs || {})) applyRemotePack(name, pack); }
    else if (m.t === 'pack') applyRemotePack(m.name, m.pack);
    else if (m.t === 'drop') { applyingRemote = true; delete db.packs[m.name];
      if (!Object.keys(db.packs).length) db.packs[packName] = { frames: [blankFrame()] };
      localStorage.setItem(KEY, JSON.stringify(db)); applyingRemote = false;
      if (m.name === packName) { packName = Object.keys(db.packs)[0]; loadFrame(0); }
      renderPacks(); }
    else if (m.t === 'peers') { peers = m.n; setStat('in room "' + code + '" · ' + peers + ' here'); }
  };
  ws.onclose = () => { ws = null; setStat('disconnected'); roomBtn.textContent = 'join room'; roomBtn.classList.remove('on'); };
  ws.onerror = () => setStat('connection failed');
}
roomBtn.addEventListener('click', () => {
  if (ws) { try { ws.close(); } catch {} ws = null; setStat('off');
    roomBtn.textContent = 'join room'; roomBtn.classList.remove('on'); return; }
  roomJoin();
});

save();          // ensure the default pack exists on first visit
renderPal(); renderPacks(); renderFrames(); loadFrame(0);
</script>
</body>
</html>
